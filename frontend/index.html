<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>👥 用户管理</h1>
            <p class="subtitle">系统用户列表</p>
        </header>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <span class="total-count">共 <strong id="countEl">0</strong> 条记录</span>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-success" id="addBtn" title="添加用户">
                    ➕ 新建用户
                </button>
                <button class="btn btn-primary" id="refreshBtn" title="刷新列表">
                    🔄 刷新
                </button>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="loading" id="loadingEl" style="display:none;">
            <div class="spinner"></div>
            <span>加载中...</span>
        </div>

        <!-- 错误提示 -->
        <div class="alert alert-error" id="errorEl" style="display:none;"></div>

        <!-- 空状态 -->
        <div class="empty" id="emptyEl" style="display:none;">
            <div class="empty-icon">📭</div>
            <p>暂无用户数据</p>
        </div>

        <!-- 用户表格 -->
        <div class="table-wrapper">
            <table class="table" id="userTable">
                <thead>
                    <tr>
                        <th style="width:80px;">ID</th>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th style="width:100px;">状态</th>
                        <th style="width:160px;">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- JS 动态渲染 -->
                </tbody>
            </table>
        </div>

        <!-- 分页信息 -->
        <footer class="footer">
            <span id="footerText"></span>
        </footer>
    </div>

    <!-- 用户表单模态框 -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">新建用户</h2>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label for="username">用户名 <span class="required">*</span></label>
                    <input type="text" id="username" name="username" required 
                           placeholder="请输入用户名" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" 
                           placeholder="请输入邮箱地址" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="status">状态 <span class="required">*</span></label>
                    <select id="status" name="status" required>
                        <option value="1">正常</option>
                        <option value="2">禁用</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS 模块 -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
